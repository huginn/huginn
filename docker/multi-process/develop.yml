version: '2'

services:
  mysqldata:
    image: mysql:8.0
    command: /bin/true

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - ../mysql.env
    volumes_from:
      - mysqldata

  web:
    build:
      context: ../../
      dockerfile: docker/multi-process/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      # - DATABASE_INITIAL_CONNECT_MAX_RETRIES=5
      - INTENTIONALLY_SLEEP=10
      # Uncomment to run the bundled Smokescreen egress proxy and route all
      # outbound HTTP(S) requests through it, so that Agents cannot reach
      # private or link-local addresses.  See doc/manual/outbound-requests.md.
      # - ENABLE_SMOKESCREEN=true
    env_file:
      - ../mysql.env
    depends_on:
      - mysql
