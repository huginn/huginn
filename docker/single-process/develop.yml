version: '2'

services:
  mysqldata:
    image: mysql:8.0
    command: /bin/true

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - ../mysql.env
    volumes_from:
      - mysqldata

  web:
    build:
      context: ../../
      dockerfile: docker/single-process/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../mysql.env
    depends_on:
      - mysql

  threaded:
    build:
      context: ../../
      dockerfile: docker/single-process/Dockerfile
    command: /scripts/init bin/threaded.rb
    restart: always
    env_file:
      - ../mysql.env
    depends_on:
      - mysql
      - web
