version: '2'

services:
  postgresdata:
    image: postgres:9.5
    command: /bin/true

  postgres:
    image: postgres:9.5
    restart: always
    env_file:
      - ../postgres.env
    volumes_from:
      - postgresdata

  web:
    image: ghcr.io/huginn/huginn-single-process
    restart: always
    ports:
      - "3000:3000"
    # Uncomment to run the bundled Smokescreen egress proxy and route all
    # outbound HTTP(S) requests through it, so that Agents cannot reach
    # private or link-local addresses.  See doc/manual/outbound-requests.md.
    # environment:
    #   - ENABLE_SMOKESCREEN=true
    env_file:
      - ../postgres.env
    depends_on:
      - postgres

  threaded:
    image: ghcr.io/huginn/huginn-single-process
    command: /scripts/init bin/threaded.rb
    restart: always
    # Uncomment to run the bundled Smokescreen egress proxy and route all
    # outbound HTTP(S) requests through it, so that Agents cannot reach
    # private or link-local addresses.  See doc/manual/outbound-requests.md.
    # environment:
    #   - ENABLE_SMOKESCREEN=true
    env_file:
      - ../postgres.env
    depends_on:
      - postgres
      - web
