version: '2'

services:
  mysqldata:
    image: mysql:8.0
    command: /bin/true

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - ../mysql.env
    volumes_from:
      - mysqldata

  web:
    image: ghcr.io/huginn/huginn-single-process
    restart: always
    ports:
      - "3000:3000"
    # Uncomment to run the bundled Smokescreen egress proxy and route all
    # outbound HTTP(S) requests through it, so that Agents cannot reach
    # private or link-local addresses.  See doc/manual/outbound-requests.md.
    # environment:
    #   - ENABLE_SMOKESCREEN=true
    env_file:
      - ../mysql.env
    depends_on:
      - mysql

  threaded:
    image: ghcr.io/huginn/huginn-single-process
    command: /scripts/init bin/threaded.rb
    restart: always
    # Uncomment to run the bundled Smokescreen egress proxy and route all
    # outbound HTTP(S) requests through it, so that Agents cannot reach
    # private or link-local addresses.  See doc/manual/outbound-requests.md.
    # environment:
    #   - ENABLE_SMOKESCREEN=true
    env_file:
      - ../mysql.env
    depends_on:
      - mysql
      - web
