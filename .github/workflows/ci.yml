name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: ${{ matrix.os }} ${{ matrix.database_adapter }} native-json-${{ matrix.native_json_columns }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        database_adapter:
          - mysql2
          - postgresql
        native_json_columns:
          - enabled
          - disabled
    env:
      DATABASE_ADAPTER: ${{ matrix.database_adapter }}
      DATABASE_HOST: "127.0.0.1"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
      NATIVE_JSON_COLUMNS: ${{ matrix.native_json_columns == 'enabled' && '1' || '' }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          rubygems: latest
          bundler: latest
          bundler-cache: true

      - name: Install npm packages
        run: npm install

      - name: Set up database
        run: bundle exec rake db:create db:migrate

      - name: Run tests
        run: bundle exec rake

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          fail-on-error: false

  build-docker-images:
    name: docker-build-${{ matrix.docker_image }}-${{ matrix.arch }}
    needs: run-tests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        docker_image:
          - huginn/huginn
          - huginn/huginn-single-process
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_IMAGE: ghcr.io/${{ matrix.docker_image }}
      DOCKER_ARTIFACT_BASENAME: ${{ matrix.docker_image == 'huginn/huginn' && 'huginn' || 'huginn-single-process' }}
      DOCKERFILE: docker/${{ contains(matrix.docker_image, 'single-process') && 'single-process' || 'multi-process' }}/Dockerfile
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
          outputs: ${{ github.event_name == 'push' && github.ref_name == 'master' && format('type=image,name={0},push-by-digest=true,name-canonical=true', env.DOCKER_IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.docker_image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.docker_image }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name == 'push' && github.ref_name == 'master'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.DOCKER_ARTIFACT_BASENAME }}__${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - run-tests
      - build-docker-images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check test and Docker build results
        env:
          TEST_RESULT: ${{ needs.run-tests.result }}
          BUILD_RESULT: ${{ needs.build-docker-images.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success

  push-docker-images:
    name: docker-push-${{ matrix.docker_image }}
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: build-docker-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        docker_image:
          - huginn/huginn
          - huginn/huginn-single-process
    env:
      DOCKER_ARTIFACT_BASENAME: ${{ matrix.docker_image == 'huginn/huginn' && 'huginn' || 'huginn-single-process' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ env.DOCKER_ARTIFACT_BASENAME }}__*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push to GHCR
        working-directory: /tmp/digests
        env:
          DOCKER_IMAGE: ghcr.io/${{ matrix.docker_image }}
        run: |
          digests=(*)
          digests=("${digests[@]/#/$DOCKER_IMAGE@sha256:}")
          docker buildx imagetools create \
            -t "$DOCKER_IMAGE:$GITHUB_REF_NAME" \
            -t "$DOCKER_IMAGE:$GITHUB_SHA" \
            "${digests[@]}"

      - name: Push to DockerHub with OUTDATED_DOCKER_REGISTRY flag
        env:
          GHCR_IMAGE: ghcr.io/${{ matrix.docker_image }}
          DOCKERHUB_IMAGE: ${{ matrix.docker_image }}
        run: |
          printf 'FROM %s\nENV OUTDATED_DOCKER_REGISTRY=true\n' "$GHCR_IMAGE:$GITHUB_SHA" | \
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$DOCKERHUB_IMAGE:$GITHUB_REF_NAME" \
            -t "$DOCKERHUB_IMAGE:$GITHUB_SHA" \
            --push -

  build-test-image:
    name: docker-build-huginn/huginn-test
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: push-docker-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/test/Dockerfile
          build-args: HUGINN_IMAGE=ghcr.io/huginn/huginn-single-process:${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/huginn/huginn-test
            ghcr.io/huginn/huginn-test:${{ github.sha }}
          cache-from: type=gha,scope=huginn/huginn-test-amd64
          cache-to: type=gha,mode=max,scope=huginn/huginn-test-amd64
