name: Bundle install for Renovate Ruby PRs

on:
  pull_request:
    paths:
      - "mise.toml"

permissions:
  contents: write
  pull-requests: write

jobs:
  bundle-install:
    if: github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0

      - name: Update bundle
        run: |
          bundle install
          bundle update --ruby

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || {
            git commit -m 'Update bundle for Ruby version'
            git push
          }
