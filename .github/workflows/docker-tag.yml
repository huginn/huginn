name: Tag Docker images

# Tags the Docker images built for a release commit with the release version.
# The images themselves are built and pushed by the CI workflow on every push
# to master, tagged with the commit SHA; this only adds the version tag to
# those manifests without rebuilding anything.  Push a release tag only after
# the CI run for its commit has published the images, or dispatch this
# workflow with the tag name afterwards.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to apply to the images built for its commit, e.g. v2026.09.08"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag-docker-images:
    name: docker-tag-${{ matrix.docker_image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        docker_image:
          - huginn/huginn
          - huginn/huginn-single-process
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the images built for the release commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for image in "ghcr.io/${{ matrix.docker_image }}" "${{ matrix.docker_image }}"; do
            docker buildx imagetools create -t "$image:$TAG" "$image:$SHA"
          done
